# WorldWatcher - full stack (client + server + database)
#
# Usage:
#   1. Copy .env.example to .env and adjust if needed (defaults work as-is).
#   2. docker compose up -d
#
# On first run, the db service restores WorldWatcher_DB from
# Database/WorldWatcher_DB_Backup_v1.sql automatically (see
# Database/docker-init/01-restore.sh). This only happens once - if you need
# to re-seed, remove the worldwatcher_pgdata volume first
# (docker compose down -v).
#
# client/server images are pulled from Docker Hub - no local build needed.
# To build + push new versions of those images yourself, see
# scripts/build-and-push.ps1.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WW_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${WW_DB_PASSWORD:-1234}
      # Deliberately NOT WW_DB_NAME here: the backup dump itself creates the
      # WorldWatcher_DB database on restore (see docker-init/01-restore.sh).
      POSTGRES_DB: postgres
    volumes:
      - worldwatcher_pgdata:/var/lib/postgresql/data
      - ./Database/docker-init:/docker-entrypoint-initdb.d:ro
      - ./Database/WorldWatcher_DB_Backup_v1.sql:/backup/WorldWatcher_DB_Backup_v1.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WW_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    image: nihtin/worldwatcher:server_v1
    restart: unless-stopped
    environment:
      WW_DB_HOST: db
      WW_DB_PORT: 5432
      WW_DB_NAME: ${WW_DB_NAME:-WorldWatcher_DB}
      WW_DB_USER: ${WW_DB_USER:-postgres}
      WW_DB_PASSWORD: ${WW_DB_PASSWORD:-1234}
      WW_SECRET_KEY: ${WW_SECRET_KEY:-dev-secret-change-me}
      WW_CORS_ORIGINS: ${WW_CORS_ORIGINS:-*}
      WW_ASSETS_DIR: /assets
      WW_ASSET_UPLOAD_MAX_MB: ${WW_ASSET_UPLOAD_MAX_MB:-25}
      WW_HOST: 0.0.0.0
      WW_PORT: 8000
      WW_DEBUG: "false"
    volumes:
      - ./Database/Maintainance/assets:/assets
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    image: nihtin/worldwatcher:client_v1
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  worldwatcher_pgdata:
